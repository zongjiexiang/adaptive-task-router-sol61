name: Validate plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -B tests/check_structure.py
      - name: Check committed whitespace
        env:
          ROUTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROUTER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$ROUTER_BASE_SHA" || "$ROUTER_BASE_SHA" =~ ^0+$ ]]; then
            ROUTER_BASE_SHA=$(git hash-object -t tree /dev/null)
          else
            git cat-file -e "$ROUTER_BASE_SHA^{commit}" || git fetch --no-tags origin "$ROUTER_BASE_SHA"
          fi
          git diff --check "$ROUTER_BASE_SHA" "$ROUTER_HEAD_SHA"
          git diff --check
